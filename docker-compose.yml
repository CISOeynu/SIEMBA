version: '3.8'

# SIEMBA Full Stack
# Usage: cp .env.example .env && nano .env && docker compose up -d

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: siemba-elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=siemba-cluster
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "127.0.0.1:9200:9200"
    networks: [siemba]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: siemba-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - XPACK_SECURITY_ENABLED=false
    volumes:
      - ./config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [siemba]
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: siemba-logstash
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    volumes:
      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./config/logstash/pipelines:/usr/share/logstash/pipeline:ro
      - ./config/threat-intel:/threat-intel:ro
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
      - "5000:5000/tcp"
      - "8080:8080/tcp"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [siemba]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: siemba-grafana
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks: [siemba]
    restart: unless-stopped

  thehive:
    image: strangebee/thehive:5
    container_name: siemba-thehive
    environment:
      - TH_SECRET=${THEHIVE_SECRET:-changeme_in_production}
    volumes:
      - thehive_data:/opt/thp/thehive/db
      - thehive_files:/opt/thp/thehive/files
      - ./config/thehive/application.conf:/etc/thehive/application.conf:ro
    ports:
      - "127.0.0.1:9000:9000"
    networks: [siemba]
    restart: unless-stopped

  siemba-ui:
    build:
      context: ./siemba-ui
      dockerfile: Dockerfile
    container_name: siemba-ui
    env_file: .env
    environment:
      - ES_HOST=http://elasticsearch:9200
      - THEHIVE_URL=http://thehive:9000
      - GRAFANA_URL=http://grafana:3000
      - KIBANA_URL=http://kibana:5601
    volumes:
      - ./config/threat-intel:/app/threat-intel
      - tool_results:/app/tool-results
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [siemba]
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: siemba-nginx
    volumes:
      - ./config/nginx/siemba.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [siemba-ui, kibana, grafana, thehive]
    networks: [siemba]
    restart: unless-stopped

networks:
  siemba:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  es_data:
  grafana_data:
  thehive_data:
  thehive_files:
  nginx_certs:
  tool_results:
