input {
  http {
    port => 8083
    type => "azure"
    codec => "json"
  }
}

filter {
  mutate {
    add_field => {
      "source_integration" => "azure"
      "siemba_ingest_time" => "%{@timestamp}"
    }
  }

  if [category] == "SignInLogs" {
    mutate { add_tag => ["azure_signin"] }
    if [resultType] and [resultType] != "0" {
      mutate { add_field => { "siemba_severity" => "high" } }
    } else {
      mutate { add_field => { "siemba_severity" => "low" } }
    }
    # High-risk sign-in
    if [riskLevelDuringSignIn] in ["high", "medium"] {
      mutate { update => { "siemba_severity" => "critical" } }
    }
  }

  if [category] == "AuditLogs" {
    mutate { add_tag => ["azure_audit"] }
    if [operationName] in ["Delete user", "Reset user password", "Add member to role"] {
      mutate { add_field => { "siemba_severity" => "high" } }
    }
  }

  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:http://127.0.0.1:9200}"]
    index => "siemba-azure-%{+YYYY.MM.dd}"
  }
}
