input {
  # Re-process all siemba indices for threat intel enrichment
  elasticsearch {
    hosts            => ["${ELASTICSEARCH_HOST:http://127.0.0.1:9200}"]
    index            => "siemba-*"
    query            => '{"query":{"bool":{"must_not":[{"exists":{"field":"ti_checked"}}]}}}'
    schedule         => "* * * * *"
    scroll           => "5m"
    size             => 500
    docinfo          => true
    docinfo_target   => "[@metadata][doc]"
  }
}

filter {
  # Load threat intel lists from file (refreshed by SIEMBA UI)
  translate {
    field           => "[host]"
    destination     => "ti_host_match"
    dictionary_path => "/threat-intel/ip-blocklist.yml"
    fallback        => "clean"
  }
  translate {
    field           => "[ClientIP]"
    destination     => "ti_clientip_match"
    dictionary_path => "/threat-intel/ip-blocklist.yml"
    fallback        => "clean"
  }
  translate {
    field           => "[url]"
    destination     => "ti_url_match"
    dictionary_path => "/threat-intel/domain-blocklist.yml"
    fallback        => "clean"
  }

  mutate { add_field => { "ti_checked" => "true" } }

  # Flag if any match found
  if [ti_host_match] != "clean" or [ti_clientip_match] != "clean" or [ti_url_match] != "clean" {
    mutate {
      add_field => { "ti_matched" => "true" }
      add_tag   => ["threat_intel_hit"]
      update    => { "siemba_severity" => "critical" }
    }
  }
}

output {
  if "threat_intel_hit" in [tags] {
    # Write back to a dedicated TI hits index
    elasticsearch {
      hosts  => ["${ELASTICSEARCH_HOST:http://127.0.0.1:9200}"]
      index  => "siemba-ti-hits-%{+YYYY.MM.dd}"
      action => "index"
    }
  }
  # Update original document with TI result
  elasticsearch {
    hosts     => ["${ELASTICSEARCH_HOST:http://127.0.0.1:9200}"]
    index     => "%{[@metadata][doc][_index]}"
    document_id => "%{[@metadata][doc][_id]}"
    action    => "update"
    doc_as_upsert => true
  }
}
