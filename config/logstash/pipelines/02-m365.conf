input {
  # SIEMBA UI polls M365 Graph API and POSTs results here
  http {
    port => 8081
    type => "m365"
    codec => "json"
    additional_codecs => { "application/json" => "json" }
  }
}

filter {
  mutate {
    add_field => {
      "source_integration" => "m365"
      "siemba_ingest_time" => "%{@timestamp}"
    }
  }

  # Map M365 operation severity
  if [Operation] {
    if [Operation] in ["UserLoginFailed", "PasswordSprayAttack", "MalwareDetected"] {
      mutate { add_field => { "siemba_severity" => "critical" } }
    } else if [Operation] in ["FileDeleted", "SharingInvitationCreated", "AddMember"] {
      mutate { add_field => { "siemba_severity" => "medium" } }
    } else {
      mutate { add_field => { "siemba_severity" => "low" } }
    }
  }

  # Impossible travel detection tag
  if [ClientIP] and [UserId] {
    mutate { add_tag => ["m365_event"] }
  }

  date {
    match => ["CreationTime", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:http://127.0.0.1:9200}"]
    index => "siemba-m365-%{+YYYY.MM.dd}"
  }
}
