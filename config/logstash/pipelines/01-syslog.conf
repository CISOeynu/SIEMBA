input {
  # UDP syslog (most network devices default)
  syslog {
    port => 5514
    type => "syslog-udp"
  }
  # TCP syslog (reliable)
  tcp {
    port => 5514
    type => "syslog-tcp"
    codec => "plain"
  }
  # JSON over TCP (custom apps)
  tcp {
    port => 5000
    type => "json-tcp"
    codec => "json_lines"
  }
}

filter {
  mutate {
    add_field => {
      "source_integration" => "syslog"
      "siemba_ingest_time" => "%{@timestamp}"
    }
  }

  if [type] == "syslog-udp" or [type] == "syslog-tcp" {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}",
          "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{GREEDYDATA:syslog_message}"
        ]
      }
      overwrite => ["message"]
      add_tag => ["syslog_parsed"]
    }
    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
    }
  }

  # Basic severity tagging
  if [severity] {
    if [severity] <= 2 { mutate { add_field => { "siemba_severity" => "critical" } } }
    else if [severity] <= 4 { mutate { add_field => { "siemba_severity" => "high" } } }
    else if [severity] <= 5 { mutate { add_field => { "siemba_severity" => "medium" } } }
    else { mutate { add_field => { "siemba_severity" => "low" } } }
  }

  # GeoIP enrichment for source IPs
  if [host] and [host] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|192\.168\.)/ {
    geoip {
      source => "host"
      target => "geoip"
    }
  }
}

output {
  elasticsearch {
    hosts        => ["${ELASTICSEARCH_HOST:http://127.0.0.1:9200}"]
    index        => "siemba-syslog-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
}
